<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MR.AN7 Travel – Applications</title>
<meta name="theme-color" content="#0a2a6b"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MR.AN7 Travel"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0b1f4d;--mut:#5b6b8c;--line:#d5deee;--navy:#0a2a6b;--or:#ff7a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#07142e;--card:#0f2250;--ink:#eef3ff;--mut:#9fb0d6;--line:#25397a}}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.5}
header{background:linear-gradient(120deg,#0a2a6b,#123c9c 60%,#ff7a00);color:#fff;padding:18px 16px}
.hw{max-width:900px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hw img{height:64px;border-radius:8px}.hw h1{font-size:1.25rem;margin:0;flex:1;min-width:200px}
select,input,button{font:inherit}
.lang{padding:8px 10px;border-radius:8px;border:0}
main{max-width:900px;margin:20px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:1.05rem}
.srv{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.srv label{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-weight:600}
.srv label:has(input:checked){border-color:var(--or);background:rgba(255,122,0,.1)}
.srv input{width:20px;height:20px;accent-color:var(--or)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.f label{display:block;font-size:.88rem;color:var(--mut);margin-bottom:4px}
.f input,.f select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.f input:focus,.f select:focus,button:focus-visible{outline:3px solid var(--or);outline-offset:1px}
.gen{display:flex;gap:16px;padding-top:6px}.gen label{display:flex;gap:6px;color:var(--ink);font-size:1rem}
canvas{width:100%;height:150px;background:#fff;border:1px dashed var(--navy);border-radius:10px;touch-action:none;display:block}
.btn{background:var(--or);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-weight:700;cursor:pointer}
.btn.s{background:var(--navy)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#doc{background:#fff;color:#111;border:1px solid #bbb;border-radius:6px;padding:28px;max-width:794px;margin:12px auto}
#doc .top{display:flex;align-items:center;gap:14px;border-bottom:4px solid #ff7a00;padding-bottom:12px;margin-bottom:14px}
#doc .top img{height:80px}#doc h3{margin:0;font-size:1.3rem;color:#0a2a6b}
#doc table{width:100%;border-collapse:collapse}#doc td{border:1px solid #ccd;padding:8px;vertical-align:top}
#doc td:first-child{width:36%;background:#eef2fb;font-weight:700}
#doc .sig{height:90px;max-width:100%}#doc .ft{margin-top:14px;font-size:.8rem;color:#555}#doc .stamp{display:flex;justify-content:flex-end;margin-top:14px}#doc .stamp svg{width:150px;height:150px;transform:rotate(-12deg);opacity:.9;mix-blend-mode:multiply;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.app{display:block;position:relative;overflow:hidden;border-radius:18px;margin:0 auto 18px;max-width:520px;box-shadow:0 10px 28px rgba(10,42,107,.45);animation:fl2 3.5s ease-in-out infinite}.app:hover{animation-play-state:paused;transform:scale(1.02)}.app img{width:100%;display:block}.app::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:sh 3.5s ease-in-out infinite}.app b{position:absolute;bottom:12px;inset-inline:12px;text-align:center;background:linear-gradient(135deg,#ffa730,#ff5e00);color:#fff;padding:10px;border-radius:30px;animation:pl2 1.6s ease-in-out infinite;z-index:2}@keyframes fl2{50%{transform:translateY(-7px)}}@keyframes sh{0%{left:-60%}60%,100%{left:130%}}@keyframes pl2{50%{transform:scale(1.05)}}@media(prefers-reduced-motion:reduce){.app,.app::after,.app b{animation:none}}:root[data-theme=dark]{--bg:#07142e;--card:#0f2250;--ink:#eef3ff;--mut:#9fb0d6;--line:#25397a}.steps{list-style:none;display:flex;gap:8px;padding:0;margin:0 0 16px;counter-reset:s}.steps li{flex:1;text-align:center;padding:10px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:.85rem;font-weight:600;counter-increment:s}.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);margin-inline-end:6px;font-size:.75rem}.steps li.on{border-color:var(--or);color:var(--ink)}.steps li.done{color:var(--ink)}.steps li.on::before,.steps li.done::before{background:var(--or);color:#fff}.tab{display:none}.touch .f input,.touch .f select,.touch .btn{min-height:48px}.lang{cursor:pointer}
@media(min-width:960px){main{max-width:1180px;display:grid;grid-template-columns:340px 1fr;gap:0 24px;align-items:start}main>.app{grid-column:1;grid-row:1/span 6;position:sticky;top:20px;margin:0;max-width:none;animation:none}main>:not(.app){grid-column:2}.hw{max-width:1180px}.card{padding:24px}.hw img{height:72px}}
@media(max-width:760px){body{padding-bottom:88px;font-size:16px}header{position:sticky;top:0;z-index:40;padding:10px 12px}.hw{gap:8px;flex-wrap:nowrap}.hw img{height:42px}.hw h1{font-size:.85rem;min-width:0}.fab{display:none!important}.tab{display:flex;position:fixed;bottom:0;inset-inline:0;z-index:60;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.15)}.tab a,.tab button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--mut);background:none;border:0;text-decoration:none;padding:6px 2px;cursor:pointer}.tab i{font-style:normal;font-size:1.4rem}.btn{width:100%;padding:14px}.row .btn{flex:1}.card{border-radius:18px;padding:16px}.f input,.f select{font-size:16px;padding:12px}.srv{grid-template-columns:1fr}.app{max-width:100%;border-radius:20px}.steps li{font-size:.72rem;padding:8px 2px}.steps li::before{display:block;margin:0 auto 2px}}
.srv{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.srv label{flex-direction:column;align-items:flex-start;gap:4px;position:relative;padding:16px;transition:transform .2s,box-shadow .2s}.srv label:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(10,42,107,.18)}.srv input{position:absolute;top:12px;inset-inline-end:12px}.srv i{font-style:normal;font-size:2rem}.srv small{font-weight:400;color:var(--mut)}.srv label:has(input:checked){box-shadow:0 8px 20px rgba(255,122,0,.3)}.sp{border:1px solid var(--line);border-inline-start:5px solid var(--or);border-radius:12px;padding:14px;margin-top:14px;animation:op .3s}.sp h3{margin:0 0 10px;font-size:1rem}@keyframes op{from{opacity:0;transform:translateY(-6px)}}#out,#pay{display:none}.fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-end:14px;z-index:50;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffa730,#ff5e00);color:#fff;text-decoration:none;font-size:1.7rem;border:3px solid #fff;box-shadow:0 8px 22px rgba(255,94,0,.55);animation:fl 3s ease-in-out infinite}.fab::before{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid #ff7a00;animation:pl 2s ease-out infinite}.fab:hover,.fab:focus-visible{animation-play-state:paused}.fab span,.fab small{position:absolute;inset-inline-end:72px;background:var(--navy);color:#fff;font-size:.8rem;font-weight:600;padding:5px 10px;border-radius:10px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s}.fab span{bottom:50%;margin-bottom:2px}.fab small{top:50%;margin-top:2px;direction:ltr}.fab:hover span,.fab:hover small,.fab:focus-visible span,.fab:focus-visible small{opacity:1}@keyframes fl{50%{transform:translateY(-8px)}}@keyframes pl{to{transform:scale(1.55);opacity:0}}@media(prefers-reduced-motion:reduce){.fab,.fab::before{animation:none}}.nets{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.net{border:2px solid var(--or);border-radius:12px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}.net div[id^=q]{background:#fff;padding:8px;border-radius:8px}.net code{word-break:break-all;font-size:.78rem;user-select:all;direction:ltr}
@media print{body *{visibility:hidden}#doc,#doc *{visibility:visible}#doc{position:absolute;inset:0;border:0;margin:0;max-width:none}}
